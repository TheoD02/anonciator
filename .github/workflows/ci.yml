name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qa:
    name: Code quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.5'
          coverage: none

      - run: composer install --no-interaction --no-progress --prefer-dist

      - name: ECS
        run: vendor/bin/ecs check --ansi --config vendor-bin/ecs/ecs.php --clear-cache

      - name: Rector
        run: vendor/bin/rector process --ansi --config vendor-bin/rector/rector.php --clear-cache --dry-run

      - name: Lint container
        run: php bin/console lint:container

      - name: PHPStan
        run: vendor/bin/phpstan analyse --ansi --configuration vendor-bin/phpstan/phpstan.neon --memory-limit=1G --error-format=github

  tests:
    name: Run Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: symfony
          POSTGRES_PASSWORD: symfony
          POSTGRES_DB: symfony_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      APP_ENV: test
      DATABASE_URL: "postgresql://symfony:symfony@127.0.0.1:5432/symfony_test?serverVersion=16"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.5'
          coverage: none

      - run: composer install --no-interaction --no-progress --prefer-dist

      - name: Prepare test database and JWT keys
        run: |
          php bin/console lexik:jwt:generate-keypair --skip-if-exists
          php bin/console doctrine:database:create --if-not-exists

      - name: Run Tests
        run: vendor/bin/phpunit
